<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 56" width="120" height="112"><defs>
    <linearGradient id="fried-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F29A43"/>
      <stop offset=".42" stop-color="#D7652D"/>
      <stop offset=".78" stop-color="#B64024"/>
      <stop offset="1" stop-color="#833024"/>
    </linearGradient>
    <linearGradient id="wing-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD083"/>
      <stop offset="1" stop-color="#E57A37"/>
    </linearGradient>
  </defs>
  <ellipse cx="31" cy="49.5" rx="23" ry="2.8" fill="#563645" opacity=".16"/>

  <!-- One continuous edible-wing silhouette: pointed tip, broad flat, round drumette. -->
  <path d="M5.2 11.8
           C10.1 12.5 15.7 15.1 19.7 18.8
           C23 21.8 25.1 26.2 29.1 29.2
           C33 32.2 37.2 30.5 41.3 27.7
           C46 24.5 52.1 26 55 30.5
           C58 35.2 56 41.4 51.7 45.2
           C47.4 49 41.5 50.1 36.6 47.2
           C31.9 44.5 29.2 40.4 25.9 38.1
           C22.1 35.4 18.7 37.1 14.9 35.6
           C10.4 33.8 8.5 29.2 10.4 24.8
           C12 21 10.2 17.2 6.1 15.3
           C3.9 14.3 3.5 12.4 5.2 11.8 Z"
        fill="url(#fried-wing)" stroke="#2E2440" stroke-width="2.35"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Flat-section highlight follows the meat rather than forming decorative stripes. -->
  <path d="M8.1 14.7 C13.8 16 17.3 18.8 19.9 22.6
           C22.5 26.3 24.3 30.3 28.9 33.3"
        fill="none" stroke="url(#wing-light)" stroke-width="3"
        stroke-linecap="round" opacity=".9"/>
  <path d="M11.2 23.1 C15 21.6 19 23.4 20.8 27
           C22.6 30.7 24.2 34.1 28 36.1"
        fill="none" stroke="#94351F" stroke-width="1.15"
        stroke-linecap="round" opacity=".85"/>

  <!-- A single joint crease makes the drumette readable while keeping the wing joined. -->
  <path d="M34.1 31 C36.8 34 38.4 38.9 37.7 45.8"
        fill="none" stroke="#7D2C24" stroke-width="1.7"
        stroke-linecap="round" opacity=".88"/>
  <path d="M39.2 31 C43.2 28.1 48.3 28.7 51.5 31.8"
        fill="none" stroke="#F39B50" stroke-width="2.35"
        stroke-linecap="round" opacity=".78"/>

  <!-- Crisp browned patches and chilli flakes, kept large enough for 52 x 49 px. -->
  <path d="M14.5 29.2 C16.6 26.8 20.2 27.9 20.8 30.7
           C21.2 33 18.6 34.5 16.4 33.7 C14.3 33 13.2 30.8 14.5 29.2 Z"
        fill="#7E2D22" opacity=".86"/>
  <path d="M43.5 38.1 C45.3 35.6 49 35.4 50.4 38
           C51.4 39.9 49.5 42 47 42.3 C44.5 42.6 42.2 40.2 43.5 38.1 Z"
        fill="#8E3022" opacity=".82"/>
  <g fill="#6F2823">
    <circle cx="14.4" cy="23.7" r="1.05"/>
    <circle cx="23.8" cy="32.2" r=".9"/>
    <circle cx="31" cy="37.1" r="1.05"/>
    <circle cx="45.7" cy="32.7" r=".95"/>
    <circle cx="51.1" cy="36.2" r=".8"/>
  </g>
  <g fill="#F2B74C" stroke="#8C3526" stroke-width=".45">
    <ellipse cx="12.4" cy="18.5" rx="1.15" ry=".75" transform="rotate(24 12.4 18.5)"/>
    <ellipse cx="26.9" cy="34.2" rx="1.05" ry=".7" transform="rotate(-18 26.9 34.2)"/>
    <ellipse cx="41.9" cy="35" rx="1.05" ry=".7" transform="rotate(28 41.9 35)"/>
  </g></svg>