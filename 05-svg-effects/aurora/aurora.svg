<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-labelledby="wb-aurora-title">
 <title id="wb-aurora-title">WordBar Aurora Lantern coloured-light effect</title>
 <defs>
  <linearGradient id="wb-aurora-mint" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b9ffe1" stop-opacity=".1"/><stop offset=".45" stop-color="#6bc5b8" stop-opacity=".7"/><stop offset="1" stop-color="#6bc5b8" stop-opacity="0"/></linearGradient>
  <linearGradient id="wb-aurora-lilac" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d7c1ff" stop-opacity=".05"/><stop offset=".45" stop-color="#ad8cd4" stop-opacity=".55"/><stop offset="1" stop-color="#ad8cd4" stop-opacity="0"/></linearGradient>
  <linearGradient id="wb-aurora-gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff1b1" stop-opacity="0"/><stop offset=".5" stop-color="#d9e39e" stop-opacity=".42"/><stop offset="1" stop-color="#d9e39e" stop-opacity="0"/></linearGradient>
  <linearGradient id="wb-aurora-edge"><stop stop-color="white" stop-opacity="0"/><stop offset=".12" stop-color="white"/><stop offset=".88" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
  <mask id="wb-aurora-mask"><rect width="800" height="220" fill="url(#wb-aurora-edge)"/></mask>
 </defs>
 <style>
  .wb-aurora-strength{opacity:var(--aurora-strength,.8)}
  .wb-aurora-band{transform-origin:400px 100px;animation:wbAuroraFloat 12s ease-in-out infinite}
  .wb-aurora-band:nth-child(2){animation-duration:15s;animation-delay:-5s}
  .wb-aurora-band:nth-child(3){animation-duration:18s;animation-delay:-9s}
  @keyframes wbAuroraFloat{0%,100%{transform:translateY(-3px);opacity:.85}50%{transform:translateY(4px);opacity:1}}
  .wb-aurora-spark{animation:wbAuroraSpark 7s ease-in-out infinite}
  @keyframes wbAuroraSpark{0%,100%{opacity:.28}50%{opacity:.7}}
  @media(prefers-reduced-motion:reduce){.wb-aurora-band,.wb-aurora-spark{animation:none}}
 </style>
 <g class="wb-aurora-strength" pointer-events="none" mask="url(#wb-aurora-mask)">
  <path class="wb-aurora-band" d="M30 67 C155 5 243 123 385 70 S620 12 770 49 L770 130 C615 89 531 151 389 150 S156 65 30 142Z" fill="url(#wb-aurora-mint)"/>
  <path class="wb-aurora-band" d="M35 107 C180 47 260 153 407 102 S625 75 765 90 L765 171 C623 139 538 178 409 185 S175 99 35 184Z" fill="url(#wb-aurora-lilac)"/>
  <path class="wb-aurora-band" d="M33 35 C170 0 270 89 409 46 S633 17 767 33 L767 94 C630 63 542 118 405 113 S165 42 33 100Z" fill="url(#wb-aurora-gold)"/>
  <g class="wb-aurora-spark" fill="#fff4d3"><circle cx="95" cy="44" r="1.7"/><circle cx="289" cy="54" r="1.3"/><circle cx="537" cy="32" r="1.6"/><circle cx="711" cy="72" r="1.2"/></g>
 </g>
</svg>
